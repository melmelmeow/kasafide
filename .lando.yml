name: kasafide

config:
  via: cli
  approot: .

services:
  node-dev:
    type: node:20
    port: '3000'
    portforward: 3000
    ssl: true
    run_as_root:
      - npm install -g npm@latest
    build:
      - npm install --legacy-peer-deps
      - npx prisma generate
    command: npm run dev

proxy:
  node-dev:
    - kasafide.lndo.site

tooling:
  npm:
    service: node-dev
  node:
    service: node-dev
  prisma:
    service: node-dev
