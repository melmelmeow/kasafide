name: kasafide 

config:
  via: cli
  # Points Lando to the root directory where package.json lives
  approot: .
services:
  node-dev:
    type: node:22
    port: '3000'
    build: 
      - npm install
    command: npm run dev
proxy:
  node-dev:
    - kasafide.lndo.site:3000
tooling:
  npm:
    service: node-dev
  node:
    service: node-dev
